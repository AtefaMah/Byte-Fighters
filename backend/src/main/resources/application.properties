# ==========================================
# CONFIGURACIÓN DE LA APLICACIÓN TICKETEA
# ==========================================

# Puerto del servidor (por defecto 8080)
server.port=8080

# ==========================================
# BASE DE DATOS H2 (en memoria)
# ==========================================

# URL de conexión a H2 en memoria
spring.datasource.url=jdbc:h2:mem:ticketeadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# Driver de H2
spring.datasource.driver-class-name=org.h2.Driver

# Usuario y contraseña (por defecto en H2)
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# JPA / HIBERNATE
# ==========================================

# Hibernate crea/actualiza las tablas automáticamente según los @Entity
spring.jpa.hibernate.ddl-auto=create-drop

# Mostrar las consultas SQL en la consola (útil para depurar)
spring.jpa.show-sql=true

# Formatear el SQL para que sea legible
spring.jpa.properties.hibernate.format_sql=true

# Dialecto de H2 para Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ==========================================
# CONSOLA H2 (accesible en /h2-console)
# ==========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# DATOS INICIALES
# ==========================================
# Cargar el fichero data.sql al arrancar
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8